name: PR Tests

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: pr-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, typecheck & unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    # Throwaway Postgres for the migration-chain verification below. Holds no
    # data and is never seeded — the check creates and drops its own database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Does every workspace package's test situation match what is recorded?
      # The recursive run below follows the code rather than a list, which
      # means a package with no test:run script is skipped silently — this is
      # what turns that silence into a red build. Runs before the build both
      # for fast feedback and because it needs nothing built; it also keeps
      # the orphan-test check away from .next/standalone, which it prunes
      # anyway. See test-manifest.json.
      - name: Check test manifest
        run: pnpm check:test-manifest

      # Does applying the checked-in migrations to an empty database produce the
      # schema the client expects? Hand-written migrations are standing practice
      # here, so this is the expected failure of the workflow rather than a rare
      # one. Runs before the build for fast feedback; it needs only the schema.
      - name: Verify migration chain
        run: pnpm --filter @midcurve/database db:migrate:verify
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # `prisma format` is not a check: it has no --check mode in 6.19.0, whose
      # only flags are --help, --config and --schema. So the check is to run the
      # formatter and see whether it changed anything — the same shape as the
      # treasury-artifact check below, and for the same reason. A
      # repository-standard tool nobody can run without producing an unrelated
      # 59-line diff is the same defect class as a script that cannot execute.
      #
      # The diff is deliberately *not* path-scoped, which is the one place this
      # departs from the treasury check. `git diff --exit-code -- <path>` reports
      # success forever if the path is mistyped: git diffs nothing, exits 0, and
      # the step stays green while claiming to have verified formatting — and no
      # amount of green disproves it. Bare, the failure mode inverts: an earlier
      # step that dirties the tree turns this red immediately, once, on a change
      # somebody is already watching. --exit-code prints the diff, so a red names
      # the file whatever the cause.
      #
      # Nothing else writes to a tracked path before this point — install is
      # --frozen-lockfile, prisma generate's output is gitignored, and the
      # migration-chain script writes only to a throwaway database. Established
      # by reading `git status --porcelain` at this point in the job during #92's
      # verification, rather than assumed.
      #
      # Needs no database, no DATABASE_URL and nothing built: the formatter parses
      # the schema and rewrites it, and never resolves env("DATABASE_URL"). Placed
      # after the migration chain rather than before it so a formatting failure
      # leaves the more substantive check's result visible above it.
      #
      # prisma is deliberately not pinned to an exact version. An upgrade that
      # changes the formatter's output would turn this red on an unrelated PR —
      # but that red is *true*: the file genuinely is not in the shape the current
      # tool produces, and the message names the one command that fixes it.
      # Contrast the Foundry pin below, where an upstream change produces a red
      # about code nobody touched with nothing the reader can act on.
      # TEMPORARY — removed with the probe commit that added it. The step below
      # uses a bare `git diff`, which is only safe if nothing earlier in the job
      # writes to a tracked path. Read it rather than assume it. See #92.
      - name: 'PROBE: is the working tree clean at this point?'
        run: |
          echo '--- git status --porcelain ---'
          git status --porcelain
          echo '--- end (nothing between the markers means clean) ---'

      - name: Verify prisma schema is formatted
        run: |
          pnpm --filter @midcurve/database db:format
          git diff --exit-code \
            || { echo "::error::schema.prisma is not formatted. Run 'pnpm --filter @midcurve/database db:format' and commit the result."; exit 1; }

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      # Which packages does lint actually cover? `turbo run lint` skips a
      # package that declares no lint script, and skips it silently — so a
      # gate that passes and a gate that ran over nothing produce the same
      # green tick. That is the failure #92 is about, so it is printed rather
      # than inferred: one line per package, every run, executing nothing.
      #
      # `--dry=text` is not used for this. It lists all twelve under "Tasks to
      # Run" and discloses the skip only as `Command = <NONEXISTENT>`, twenty
      # lines into each package's block — technically present, but it reads as
      # twelve packages being linted.
      #
      # Enrolment is self-serving and there is no lint manifest. Unlike
      # `pnpm -r test:run`, which cannot see a package that has tests and no
      # script, lint has no invisible-absence case: a package is configured
      # for it or it is not, and this step says which. See #92 and CLAUDE.md.
      # It also asserts, rather than only reporting. Printing the enrolled set
      # and exiting 0 regardless would leave the failure one `package.json`
      # edit away: drop @midcurve/ui's lint script and this prints twelve
      # `skipped` lines, `pnpm lint` passes over nothing, and CI is green —
      # caught only if somebody reads the log of a passing step, which nobody
      # does. So zero enrolled packages is a red build.
      #
      # `set -o pipefail` makes it fail closed in the other direction too: if
      # a future turbo changes the --dry=json shape out from under the jq,
      # the count reaches zero (or the pipeline errors) and this step fails,
      # rather than silently reporting an empty set.
      - name: Show which packages lint covers
        run: |
          set -euo pipefail

          report=$(pnpm exec turbo run lint --dry=json \
            | jq -r '.tasks[]
                     | if .command == "<NONEXISTENT>"
                       then "  skipped  \(.package)  (no lint script)"
                       else "  LINTED   \(.package)  ->  \(.command)"
                       end' \
            | sort)

          printf '%s\n' "$report"

          enrolled=$(printf '%s\n' "$report" | grep -c '^  LINTED ' || true)
          echo
          echo "Packages enrolled in lint: $enrolled"

          if [ "$enrolled" -eq 0 ]; then
            echo "::error::The lint gate covers no packages. \`pnpm lint\` would pass over nothing, which is indistinguishable from passing. Give a package an ESLint config and a \"lint\" script, or if lint is being removed deliberately, remove this step and the Lint step with it. See CLAUDE.md, \"Lint in CI\"."
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      # The treasury and factory ABIs ship as generated TypeScript (out/ is
      # gitignored). The kickstart encodes createTreasury() against the factory
      # ABI and reads a candidate treasury through the treasury ABI, so a stale
      # copy misencodes a live transaction rather than failing to compile.
      # Recompile and compare.
      # Pinned deliberately. The action's `version` input defaults to
      # "stable", which is not a fixed version — it tracks whatever the
      # latest stable Foundry release is, so the toolchain moves under us
      # between runs. With lint_on_build enabled and severity reaching down
      # to "info" (foundry.toml), an upstream release can turn this job red
      # with no change in this repository. #133 landed to stop shipping
      # builds that go red for reasons unrelated to the code; introducing
      # `forge test` on a moving toolchain would reopen that hole.
      #
      # The contrast with #133's decision *not* to pin buildx is deliberate:
      # there, losing the capability fails closed and re-raises the original
      # symptom, so the loss reports itself. Here there is no such property —
      # an upstream lint change produces a false red and nothing corrects it.
      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Verify generated treasury artifacts are current
        run: |
          cd apps/midcurve-contracts
          forge build
          pnpm gen:treasury-artifacts
          cd ../..
          git diff --exit-code -- packages/midcurve-shared/src/abis/midcurve-treasury/ \
                                  packages/midcurve-shared/src/abis/midcurve-treasury-factory/ \
            || { echo "::error::Treasury artifacts are stale. Run 'cd apps/midcurve-contracts && forge build && pnpm gen:treasury-artifacts' and commit the result."; exit 1; }

      # The Solidity suite — 125 tests over the treasury and vault contracts,
      # which had never run in CI. No fork and no RPC, so it needs no secrets
      # and takes under a second. Placed after the artifact check so a stale
      # ABI still reports as a stale ABI rather than as a test failure, and so
      # `forge build` above has already warmed the output.
      #
      # Invoked through the package script rather than as a bare `forge test`
      # so the package keeps one definition of how its tests run — that is
      # also what check B in the manifest enforces.
      - name: Test contracts (forge)
        run: pnpm --filter @midcurve/contracts forge:test

      # Every workspace package that declares test:run, without naming any of
      # them here. Six packages and 489 tests at the time of writing — the
      # same six this step replaced, so it changes no coverage today; the
      # point is that the seventh arrives on its own. test-manifest.json is
      # what stops a package from going missing from this set unnoticed.
      #
      # --reporter=append-only keeps the package name on every line, so a
      # failure is still attributable now that the six steps are one. In CI it
      # is what pnpm selects anyway for a non-TTY stdout; it is set explicitly
      # so attribution does not rest on that heuristic. Note that pnpm accepts
      # any --reporter value without validating it, so a wrong name here would
      # be ignored silently rather than error.
      - name: Unit tests (every workspace package)
        run: pnpm --reporter=append-only -r test:run
