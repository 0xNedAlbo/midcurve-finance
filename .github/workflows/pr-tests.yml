name: PR Tests

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: pr-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, typecheck & unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    # Throwaway Postgres for the migration-chain verification below. Holds no
    # data and is never seeded — the check creates and drops its own database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Does applying the checked-in migrations to an empty database produce the
      # schema the client expects? Hand-written migrations are standing practice
      # here, so this is the expected failure of the workflow rather than a rare
      # one. Runs before the build for fast feedback; it needs only the schema.
      - name: Verify migration chain
        run: pnpm --filter @midcurve/database db:migrate:verify
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test @midcurve/shared
        run: pnpm --filter @midcurve/shared test:run

      - name: Test @midcurve/api-shared
        run: pnpm --filter @midcurve/api-shared test:run

      - name: Test @midcurve/mcp-server
        run: pnpm --filter @midcurve/mcp-server test:run

      - name: Test @midcurve/services
        run: pnpm --filter @midcurve/services test:run

      - name: Test @midcurve/business-logic
        run: pnpm --filter @midcurve/business-logic test:run

      - name: Test @midcurve/onchain-data
        run: pnpm --filter @midcurve/onchain-data test:run
