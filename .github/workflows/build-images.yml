name: Build & Push Docker Images

on:
  push:
    branches:
      - main
    # This list must cover everything the Dockerfiles COPY out of the build
    # context. A build input that is not listed here ships stale: the merge
    # that changed it produces no image, and the change reaches production
    # only when some unrelated commit happens to trigger a build.
    paths:
      # Trigger on any app source change
      - "apps/midcurve-api/**"
      - "apps/midcurve-ui/**"
      - "apps/midcurve-signer/**"
      - "apps/midcurve-onchain-data/**"
      - "apps/midcurve-automation/**"
      - "apps/midcurve-business-logic/**"
      # Trigger on shared packages (affects all services)
      - "packages/**"
      # Deployed contract addresses. The API image COPYs this directory and
      # seeds it into shared_contracts on every container start, so recording
      # a deployment is a change to what the image contains.
      - "apps/midcurve-contracts/deployments/**"
      # Root manifests every image builds from. A dependency bump that touches
      # only the lockfile still changes what gets installed.
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".npmrc"
      # Trigger on workflow changes
      - ".github/workflows/build-images.yml"
  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # Compute lowercase owner once, share via output
  prepare:
    runs-on: ubuntu-latest
    outputs:
      image_prefix: ghcr.io/${{ steps.lower.outputs.owner }}/midcurve
    steps:
      - name: Lowercase owner
        id: lower
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.service }}
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: apps/midcurve-api/Dockerfile
          - service: ui
            dockerfile: apps/midcurve-ui/Dockerfile
          - service: signer
            dockerfile: apps/midcurve-signer/Dockerfile
          - service: onchain-data
            dockerfile: apps/midcurve-onchain-data/Dockerfile
          - service: automation
            dockerfile: apps/midcurve-automation/Dockerfile
          - service: business-logic
            dockerfile: apps/midcurve-business-logic/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.prepare.outputs.image_prefix }}-${{ matrix.service }}
          tags: |
            # latest on every main push
            type=raw,value=latest
            # immutable SHA tag for rollbacks
            type=sha,prefix=sha-,format=short

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers in GHCR to speed up subsequent builds
          cache-from: type=registry,ref=${{ needs.prepare.outputs.image_prefix }}-${{ matrix.service }}:buildcache
          # ignore-error: this export runs after both image tags are already
          # pushed, and GHCR intermittently rejects the blob write for
          # :buildcache (#133). A lost cache is a slower next build, not a
          # broken one — without this the job ships the image and still
          # reports red, which teaches everyone to skim past red.
          #
          # Honoured by buildkitd, not buildx: control/control.go parses the
          # value with strconv.ParseBool and solver/llbsolver/export.go nulls
          # the error. A misspelt key is skipped silently and a non-boolean
          # value is dropped with a Debugf that never reaches the Actions log —
          # in both cases cache-export failures fail the job again. That is
          # also what happens if a future BuildKit drops the attribute, so no
          # version is pinned: the capability fails closed and its loss
          # re-raises the original red build rather than passing unnoticed.
          cache-to: type=registry,ref=${{ needs.prepare.outputs.image_prefix }}-${{ matrix.service }}:buildcache,mode=max,ignore-error=true
          provenance: false
